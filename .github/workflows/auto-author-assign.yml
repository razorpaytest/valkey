name: Auto Author Assign

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Setup PMG
        uses: safedep/pmg@v0.34.0
        with:
        api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
        tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: toshimaru/auto-author-assign@4d585cc37690897bd9015942ed6e766aa7cdb97f # v3.0.1
